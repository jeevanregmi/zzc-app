name: Update Market Rates

# Runs daily at 12:15 UTC = 6:00 PM Nepal Standard Time (UTC+5:45)
on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  scrape-rates:
    name: Scrape & Update Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Run rate scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node scripts/scrape-rates.js

      - name: Upload scraper log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-failure-log
          path: /tmp/scraper.log
          retention-days: 7
